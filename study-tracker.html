<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Study Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d8dee8;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --done: #16a34a;
      --danger: #dc2626;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 32px auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat,
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 26px;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--done));
      transition: width 0.2s ease;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      color: var(--text);
      background: #e5e7eb;
    }

    button.secondary:hover {
      background: #d1d5db;
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: #b91c1c;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.45fr 0.9fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .topics {
      display: grid;
      gap: 10px;
    }

    .topic {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
    }

    .topic.done {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .topic input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--done);
    }

    .topic-title {
      font-weight: 700;
    }

    .topic-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .topic-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      min-width: 36px;
      padding: 8px;
      background: #eef2ff;
      color: var(--accent);
    }

    .icon-button:hover {
      background: #dbeafe;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      padding: 10px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 820px) {
      header,
      .grid {
        display: block;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel {
        margin-bottom: 18px;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 1120px);
        margin: 20px auto;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .topic {
        grid-template-columns: auto 1fr;
      }

      .topic-actions {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>ML Study Tracker</h1>
        <p class="subtitle">Track your scikit-learn topics, progress, notes, and study time in this browser.</p>
      </div>
      <button class="danger" id="resetButton" type="button">Reset All</button>
    </header>

    <section class="summary" aria-label="Study summary">
      <div class="stat">
        <span>Total Topics</span>
        <strong id="totalTopics">0</strong>
      </div>
      <div class="stat">
        <span>Completed</span>
        <strong id="completedTopics">0</strong>
      </div>
      <div class="stat">
        <span>Progress</span>
        <strong id="progressText">0%</strong>
      </div>
      <div class="stat">
        <span>Study Hours</span>
        <strong id="studyHours">0</strong>
      </div>
    </section>

    <div class="progress" aria-label="Completion progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="toolbar">
      <button id="markAllButton" type="button">Mark All Done</button>
      <button class="secondary" id="clearDoneButton" type="button">Clear Done</button>
    </div>

    <section class="grid">
      <div class="panel">
        <h2>Topics</h2>
        <div class="topics" id="topicsList"></div>
      </div>

      <aside class="panel">
        <h2>Add Study Item</h2>
        <form id="topicForm">
          <label>
            Topic Name
            <input id="topicName" type="text" placeholder="Example: Gradient Boosting" required>
          </label>
          <label>
            Target Date
            <input id="targetDate" type="date">
          </label>
          <label>
            Study Hours
            <input id="hours" type="number" min="0" step="0.5" value="0">
          </label>
          <label>
            Notes
            <textarea id="notes" placeholder="What to revise, links, doubts, or project ideas"></textarea>
          </label>
          <button type="submit">Add Topic</button>
        </form>
      </aside>
    </section>
  </main>

  <script>
    const storageKey = "ml-study-tracker-v1";
    const defaultTopics = [
      "Bagging",
      "Decision Tree",
      "One Hot Encoding",
      "Hyperparameter Tuning",
      "K-Means Clustering",
      "K-Fold Cross Validation",
      "K-Nearest Neighbor Classification",
      "Linear Regression",
      "Logistic Regression",
      "Multivariate Regression",
      "Naive Bayes",
      "Principal Component Analysis",
      "Projects",
      "Random Forest",
      "Regularization",
      "Support Vector Machine",
      "Train And Test Split"
    ];

    const topicsList = document.getElementById("topicsList");
    const topicForm = document.getElementById("topicForm");
    const totalTopics = document.getElementById("totalTopics");
    const completedTopics = document.getElementById("completedTopics");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const studyHours = document.getElementById("studyHours");

    let topics = loadTopics();

    function createId() {
      return `topic-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function loadTopics() {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        return JSON.parse(saved);
      }

      return defaultTopics.map((name, index) => ({
        id: createId(),
        name: `${String(index + 1).padStart(2, "0")}. ${name}`,
        done: false,
        targetDate: "",
        hours: 0,
        notes: ""
      }));
    }

    function saveTopics() {
      localStorage.setItem(storageKey, JSON.stringify(topics));
    }

    function renderTopics() {
      topicsList.innerHTML = "";

      if (topics.length === 0) {
        topicsList.innerHTML = '<div class="empty">No study topics yet.</div>';
        renderSummary();
        return;
      }

      topics.forEach((topic) => {
        const item = document.createElement("article");
        item.className = `topic${topic.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = topic.done;
        checkbox.setAttribute("aria-label", `Mark ${topic.name} complete`);
        checkbox.addEventListener("change", () => {
          topic.done = checkbox.checked;
          saveTopics();
          renderTopics();
        });

        const details = document.createElement("div");
        const title = document.createElement("div");
        title.className = "topic-title";
        title.textContent = topic.name;

        const meta = document.createElement("div");
        meta.className = "topic-date";
        const parts = [];
        if (topic.targetDate) {
          parts.push(`Target: ${topic.targetDate}`);
        }
        if (Number(topic.hours) > 0) {
          parts.push(`${topic.hours} hour${Number(topic.hours) === 1 ? "" : "s"}`);
        }
        if (topic.notes) {
          parts.push(topic.notes);
        }
        meta.textContent = parts.join(" | ");

        details.appendChild(title);
        details.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "topic-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "icon-button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editTopic(topic.id));

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "icon-button";
        deleteButton.textContent = "Del";
        deleteButton.addEventListener("click", () => deleteTopic(topic.id));

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        item.appendChild(checkbox);
        item.appendChild(details);
        item.appendChild(actions);
        topicsList.appendChild(item);
      });

      renderSummary();
    }

    function renderSummary() {
      const completed = topics.filter((topic) => topic.done).length;
      const total = topics.length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      const hours = topics.reduce((sum, topic) => sum + Number(topic.hours || 0), 0);

      totalTopics.textContent = total;
      completedTopics.textContent = completed;
      progressText.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
      studyHours.textContent = hours;
    }

    function editTopic(id) {
      const topic = topics.find((item) => item.id === id);
      if (!topic) {
        return;
      }

      const name = prompt("Topic name", topic.name);
      if (!name || !name.trim()) {
        return;
      }

      const targetDate = prompt("Target date YYYY-MM-DD", topic.targetDate);
      const hours = prompt("Study hours", topic.hours);
      const notes = prompt("Notes", topic.notes);

      topic.name = name.trim();
      topic.targetDate = targetDate || "";
      topic.hours = Number(hours || 0);
      topic.notes = notes || "";
      saveTopics();
      renderTopics();
    }

    function deleteTopic(id) {
      if (!confirm("Delete this topic?")) {
        return;
      }

      topics = topics.filter((topic) => topic.id !== id);
      saveTopics();
      renderTopics();
    }

    topicForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.getElementById("topicName").value.trim();
      if (!name) {
        return;
      }

      topics.push({
        id: createId(),
        name,
        done: false,
        targetDate: document.getElementById("targetDate").value,
        hours: Number(document.getElementById("hours").value || 0),
        notes: document.getElementById("notes").value.trim()
      });

      saveTopics();
      topicForm.reset();
      document.getElementById("hours").value = 0;
      renderTopics();
    });

    document.getElementById("markAllButton").addEventListener("click", () => {
      topics = topics.map((topic) => ({ ...topic, done: true }));
      saveTopics();
      renderTopics();
    });

    document.getElementById("clearDoneButton").addEventListener("click", () => {
      topics = topics.map((topic) => ({ ...topic, done: false }));
      saveTopics();
      renderTopics();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("Reset the tracker to the default repo topics?")) {
        return;
      }

      localStorage.removeItem(storageKey);
      topics = loadTopics();
      renderTopics();
    });

    renderTopics();
  </script>
</body>
</html>
